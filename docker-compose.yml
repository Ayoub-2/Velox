services:
  # Frontend (Next.js) - Production Standalone
  web:
    build:
      context: .
      target: runner
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: velox-web-prod
    # Wrapper script handles SSL if certs exist
    command: node /app/ssl_proxy.js
    ports:
      - "8080:8080"
      - "443:3443"
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - api
    volumes:
      # Dynamic Knowledge Base Content (Read-Only)
      - ./knowledge-base:/app/knowledge-base:ro
      # SSL Integration (No Rebuild)
      - ./scripts/ssl_proxy.js:/app/ssl_proxy.js:ro
      - ./certs:/app/certs:ro
      # Backend (FastAPI + Nuclei)
  api:
    build:
      context: ./orchestrator
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    command: |
      sh -c "
      nuclei -ut > /tmp/nuclei_update.log 2>&1 &
      exec uvicorn main:app --host 0.0.0.0 --port 8000
      "

    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ZAP_URL=http://zap:8090
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      # Reports Persistence
      - ./reports:/app/reports
      # SSL Certificates (Optional)
      - ./certs:/app/certs:ro
      # Code patch (No Rebuild)
      - ./orchestrator/tools/nuclei.py:/app/tools/nuclei.py:ro
      - ./orchestrator/routers/scans.py:/app/routers/scans.py:ro
      - ./orchestrator/utils/report_gen.py:/app/utils/report_gen.py:ro

  # Worker (Celery)
  worker:
    build:
      context: ./orchestrator
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    command: sh -c "nuclei -ut > /tmp/nuclei_worker_update.log 2>&1 & exec celery -A celery_app worker --loglevel=info"
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ZAP_URL=http://zap:8090
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./orchestrator/tools/nuclei.py:/app/tools/nuclei.py:ro

  # Periodic Task Scheduler (Celery Beat)
  beat:
    build:
      context: ./orchestrator
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    command: celery -A celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    volumes:
      - ./orchestrator/tools/nuclei.py:/app/tools/nuclei.py:ro

  # DB Backup Service (Auto-Archive)
  db-backup:
    image: postgres:15-alpine
    container_name: velox-db-backup
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    command: >
      sh -c ' echo "Starting DB Backup Service..."; while true; do
        echo "Creating backup...";
        pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /backups/backup_$(date +%Y%m%d_%H%M%S).sql;
        echo "Cleanup old backups (>7 days)...";
        find /backups -type f -mtime +7 -delete;
        echo "Sleeping for 24h...";
        sleep 86400;
      done '
    depends_on:
      db:
        condition: service_healthy

  # Job Queue Broker
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # DAST Tool: OWASP ZAP (Headless)
  zap:
    image: zaproxy/zap-stable
    shm_size: 2g
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}

volumes:
  postgres_data:
