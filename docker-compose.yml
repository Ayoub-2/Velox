services:
  # Frontend (Vite SPA) - Production Standalone
  web:
    build:
      context: .
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    image: velox-web-prod
    # Wrapper script handles SSL if certs exist
    command: node /app/ssl_proxy.js
    ports:
      - "8080:8080"
      - "443:3443"
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - api

  # Backend (Java Spring Boot + Nuclei)
  api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - KEYCLOAK_ISSUER_URI=http://keycloak:8080/realms/velox
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/velox/protocol/openid-connect/certs
      - ZAP_URL=http://zap:8090
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - KB_DIRECTORY=/app/knowledge-base
      - AUDIT_LOG_PATH=/app/project-docs/security/ai_audit.jsonl
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:
      # Reports & Audits Persistence (Named Volumes to avoid host mount issues)
      - velox_reports:/app/reports
      - velox_project_docs:/app/project-docs

  # Keycloak SSO Server
  keycloak:
    build:
      context: ./keycloak
    command: start-dev --import-realm
    ports:
      - "8088:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/realms/velox || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # DB Backup Service (Auto-Archive)
  db-backup:
    image: postgres:17.1-alpine
    container_name: velox-db-backup
    environment:
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - velox_backups:/backups
    command: >
      sh -c ' echo "Starting DB Backup Service..."; while true; do
        echo "Creating backup...";
        pg_dump -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /backups/backup_$(date +%Y%m%d_%H%M%S).sql;
        echo "Cleanup old backups (>7 days)...";
        find /backups -type f -mtime +7 -delete;
        echo "Sleeping for 24h...";
        sleep 86400;
      done '
    depends_on:
      db:
        condition: service_healthy

  # Database
  db:
    image: postgres:17.1-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # DAST Tool: OWASP ZAP (Headless)
  zap:
    image: zaproxy/zap-stable
    shm_size: 2g
    command: zap.sh -daemon -host 0.0.0.0 -port 8090 -config api.disablekey=true -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    dns:
      - ${VELOX_INTERNAL_DNS:-8.8.8.8}
      - ${VELOX_INTERNAL_DNS_SECONDARY:-8.8.4.4}
    environment:
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY}

volumes:
  postgres_data:
  velox_reports:
  velox_project_docs:
  velox_backups:
