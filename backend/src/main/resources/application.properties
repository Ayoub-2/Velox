server.port=8000

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:velox_orchestrator}
spring.datasource.username=${POSTGRES_USER:velox}
spring.datasource.password=${POSTGRES_PASSWORD:veloxpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring Security OAuth2 Keycloak Integration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/velox}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/velox/protocol/openid-connect/certs}

# OpenRouter / AI Settings
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions

# Scanner Config
nuclei.path=${NUCLEI_PATH:/usr/local/bin/nuclei}
zap.url=${ZAP_URL:http://zap:8090}

# Paths & Directories
kb.directory=${KB_DIRECTORY:../knowledge-base}
audit.log.path=${AUDIT_LOG_PATH:../project-docs/security/ai_audit.jsonl}
